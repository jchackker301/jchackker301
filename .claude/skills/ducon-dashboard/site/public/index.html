<title>Ducon Editor&#39;s War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: working desk. Week bar on top, capacity + delivery report side by side, five-stage board below, Q&A log and team agreement at the bottom. */
:root{
  --bg:#141514; --surface:#1d1e1c; --surface-2:#252624; --ink:#dcddd6; --ink-2:#9b9c94; --line:#383a36;
  --accent:#a9b57a; --accent-ink:#151a0b;
  --tierA:#d9654a; --tierB:#dcddd6; --tierC:#8d8d90;
  --good:#8dbb5a; --warn:#d8b56d; --bad:#e0624d; color-scheme:dark;
  --font-display:'Bebas Neue','Barlow Condensed','Segoe UI',system-ui,sans-serif;
  --font-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.06em;font-weight:400}
h1{font-size:44px;line-height:1}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* tactical layer: HUD strip, notched corners, scanlines, tags */
.hud b{color:var(--ink);font-weight:500}
.hud-dot{display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--good);box-shadow:0 0 8px var(--good);animation:hudblink 2.4s infinite}
.hud-dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
@keyframes hudblink{0%,86%,100%{opacity:1}92%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.hud-dot{animation:none}}
.eyebrow::before{content:"// ";color:var(--accent)}
.panel-head::after{content:"";position:absolute;left:0;bottom:-1px;width:56px;height:2px;background:var(--accent)}
input,select,textarea{border-radius:0!important}
input:focus,select:focus,textarea:focus{border-color:var(--accent)!important;outline:none;box-shadow:0 0 0 1px var(--accent)}
.cal-cell,.cal-chip,.cal-edit,.gv-slot,.gv-item,.bar,.stat,.tier,.flag{border-radius:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.weeknav .label{font-family:var(--font-mono);font-size:13px;min-width:11.5em;text-align:center}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.banner{border:1px solid var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:6px;padding:9px 12px}
.row2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.row2{grid-template-columns:minmax(0,1fr)}}

/* capacity */
.cap-settings{display:flex;gap:14px;flex-wrap:wrap}
.cap-settings label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.cap-settings input{width:92px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--font-mono)}
.bar .seg{position:absolute;top:0;bottom:0;left:0}
.bar .seg.open{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.bar .seg.done{background:var(--accent)}
.bar.over .seg.open{background:color-mix(in srgb,var(--bad) 65%,var(--surface-2))}
.bar .buffer{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink-2) 28%,transparent) 5px 6px);border-left:2px solid var(--ink-2)}
.bar-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.verdict.bad{color:var(--bad)} .verdict.good{color:var(--good)}
.tier b{font-family:var(--font-display);font-size:15px}
.tier small{color:var(--ink-2);font-size:12px}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{border-left:3px solid var(--warn);padding:5px 10px;background:color-mix(in srgb,var(--warn) 9%,transparent);font-size:13.5px}
.flag.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.flag.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,transparent)}

/* report */
.stat .l{font-size:12.5px;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-2)}

/* board */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px}
.col{background:var(--surface-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:140px;scroll-snap-align:start}
.col-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.col-head .cnt{font-family:var(--font-mono);color:var(--ink-2)}
.empty-col{color:var(--ink-2);font-size:13px;padding:8px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.card:hover{border-color:var(--ink-2)}
.card .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.who{font-weight:700;white-space:nowrap;color:var(--ink)}
.chip.A{color:var(--tierA);border-color:var(--tierA);background:color-mix(in srgb,var(--tierA) 12%,transparent)}
.chip.B{color:var(--tierB);border-color:var(--tierB);background:color-mix(in srgb,var(--tierB) 12%,transparent)}
.chip.C{color:var(--tierC);border-color:var(--tierC);background:color-mix(in srgb,var(--tierC) 14%,transparent)}
.chip.bad{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.chip.warn{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip.good{color:var(--good);border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.pips{display:flex;gap:4px;align-items:center}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-2)}
.pip.on{background:var(--good);border-color:var(--good)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gate-bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;flex:1;min-width:40px}
.gate-bar i{display:block;height:100%;background:var(--accent)}
.empty-state{border:1px dashed var(--ink-2);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:10}
.scrim[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:720px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-block:12px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lab{font-size:12px;color:var(--ink-2);font-weight:600}
.field input[type=text],.field input[type=date],.field input[type=number],.field select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:36px;width:100%}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--ink);font-weight:500}
.modal-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.modal-foot .grp{display:flex;gap:10px;flex-wrap:wrap}
.err{color:var(--bad);font-weight:500}

.flow span.s{border:1px solid var(--line);border-radius:4px;padding:2px 8px;background:var(--bg);font-weight:500}
.flow span.a{color:var(--ink-2)}
.watch{width:100%;border-collapse:collapse;min-width:760px;font-size:13.5px}
.watch th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.watch td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.watch tr.done td{color:var(--ink-2)}
.watch-title{all:unset;cursor:pointer;font-weight:600}
.watch-title:hover{text-decoration:underline}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.inv{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface-2)}
.inv h3{font-size:16px}
.inv-row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;min-width:0}
.inv-row.done{opacity:.6}
.inv-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.tip{position:fixed;z-index:50;max-width:340px;min-width:240px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 8px 28px rgba(0,0,0,.55),0 0 0 1px rgba(169,181,122,.15);border-radius:2px;padding:12px 14px;font-size:13px;line-height:1.4;pointer-events:none}
.tip[hidden]{display:none}
.tip-h{font-family:var(--font-display);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:6px;overflow-wrap:anywhere}
.tip-r{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tip-dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.tip-dl dt{color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tip-dl dd{margin:0;overflow-wrap:anywhere}
.tip-line{padding:4px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.gv-wrap{overflow-x:auto}
.gv-grid{display:grid;grid-template-columns:170px repeat(7,minmax(122px,1fr));gap:6px;min-width:1010px}
.gv-cell{background:var(--surface-2);border:1px solid var(--line);border-radius:2px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:76px}
.gv-h{min-height:0;background:transparent;border:none;padding:4px 2px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--accent);font-family:var(--font-display)}
.gv-name{min-height:0;justify-content:flex-start}
.gv-today{outline:1px solid var(--accent);box-shadow:0 0 12px rgba(169,181,122,.25)}
.gv-slot{align-self:flex-start;font-weight:700;font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:2px;padding:1px 6px}
.gv-slot.good{background:var(--good);color:#06140c;border-color:var(--good)}
.gv-slot.warn{color:var(--warn);border-color:var(--warn)}
.gv-slot.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.gv-item{font-size:12px;line-height:1.25;padding:3px 5px;border-left:2px solid var(--accent);background:var(--surface);overflow-wrap:anywhere}
.gv-item.done{border-color:var(--good);opacity:.7}
.gv-item.mission{border-color:var(--warn)}
.focus-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.proj-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.proj-grid{grid-template-columns:minmax(0,1fr)}}
.proj-up{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
.proj-up input,.proj-up select{background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:inherit;padding:4px 8px;min-height:30px;min-width:0}
.proj-line{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-item{display:flex;flex-direction:column;gap:2px;padding:5px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.pi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pi-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.pi-top .chip{flex:none}
.brief-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:8px}
@media (max-width:900px){.brief-grid{grid-template-columns:minmax(0,1fr)}}
.brief-head{font-weight:700;font-size:16px;margin:4px 0 8px;overflow-wrap:anywhere}
.brief-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.proj-desc{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-desc.run{text-overflow:clip}
.proj-desc .tk{display:inline-block;white-space:nowrap;animation:descrun 20s linear infinite}
.proj-desc .tk span{display:inline-block;padding-right:40px}
.proj-item:hover .tk{animation-play-state:paused}
@keyframes descrun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ev-form .s1{grid-column:span 1}
@media (max-width:900px){.focus-grid{grid-template-columns:minmax(0,1fr)}}
.ev-form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.ev-form .s2{grid-column:span 2}.ev-form .s3{grid-column:span 3}.ev-form .s4{grid-column:span 4}.ev-form .s6{grid-column:span 6}
@media (max-width:700px){.ev-form{grid-template-columns:minmax(0,1fr)}.ev-form .s2,.ev-form .s3,.ev-form .s4,.ev-form .s6{grid-column:span 1}}
.cal-chip.mission{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.cal-chip.mission.isdone{opacity:.55;text-decoration:line-through}
.cal-status{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:2px;padding:10px 12px;background:var(--surface-2)}
.cal-status-head,.cal-status-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-label{font-size:15px;font-weight:600;min-width:9em;text-align:center}
.cal-scroll{overflow-x:auto;padding-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:700px}
.cal-wd{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:2px 4px}
.cal-cell{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-cell.out{opacity:.45}
.cal-cell.today{border:2px solid var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(169,181,122,.35)}
.today-tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;padding:1px 5px;border-radius:2px;margin-left:4px;letter-spacing:.06em}
.cal-day{font-size:12px;color:var(--ink-2);font-weight:600}
.cal-chip,.cal-edit{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;font-size:12px;line-height:1.25;border-radius:4px;padding:3px 6px;overflow-wrap:anywhere}
.cal-chip{font-weight:600;color:#fff;background:var(--ink-2)}
.cal-chip.A,.cal-chip.B,.cal-chip.C{background:rgba(255,255,255,.07);color:var(--ink);border-left:3px solid var(--tierA)}
.cal-chip.B{border-left-color:var(--tierB)}
.cal-chip.C{border-left-color:var(--tierC)}
.cal-edit{color:var(--warn);border:1px dashed var(--warn)}
[data-room][hidden]{display:none!important}
.gv-x{all:unset;cursor:pointer;float:right;margin-left:6px;padding:0 5px;border-radius:3px;color:var(--ink-2);font-size:12px;line-height:1.4}
.gv-x:hover,.gv-x.danger{color:#fff;background:var(--bad)}
.gv-item[data-act]{cursor:pointer}
/* Create-a-Class style: grey fog, olive highlight, rounded rail with LVL, numbered rows, glass panels */
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600;display:none}
.weeknav .btn{border-radius:20px}
.rail-lv small{font-size:11px;letter-spacing:.16em;color:var(--ink-2);margin-top:2px}
.rail .room:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.rail .room[aria-current="page"]{color:#fff;background:linear-gradient(90deg,rgba(169,181,122,.50),rgba(169,181,122,.10));box-shadow:inset 3px 0 0 var(--accent)}
.rail .room[data-badge="sq"]::after{content:"";position:absolute;top:7px;right:9px;width:8px;height:8px;background:var(--good)}
.rail .room[data-badge="dia"]::after{content:"";position:absolute;top:6px;right:10px;width:8px;height:8px;background:var(--warn);transform:rotate(45deg)}
.panel,.inv,.sidebox{border-radius:0}
.panel{position:relative;border-radius:0;padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px;background:rgba(30,31,29,.70);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(6px)}
.inv,.sidebox{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.inv-row,.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:0}
.btn{padding:7px 12px;min-height:34px;border-radius:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);text-transform:uppercase;letter-spacing:.07em;font-size:12.5px;font-weight:600;font-family:var(--font-mono)}
.btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.32)}
.btn.primary{font-weight:700;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.chip{font-size:10.5px;font-weight:600;padding:1px 7px;border:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;border-radius:2px;font-family:var(--font-mono)}
.op-row.none{background:rgba(255,255,255,.05);border-left-color:rgba(255,255,255,.25)}
.op-nm i{font-style:normal;color:var(--warn);font-size:20px;margin-left:4px}
.op-meta b{color:var(--ink);font-weight:500}
.kv b.bad{color:var(--bad)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:rgba(255,255,255,.11);stroke-width:12}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:12;filter:drop-shadow(0 0 10px rgba(169,181,122,.55))}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display)}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;position:relative}
.cta:hover{background:var(--accent);color:var(--accent-ink)}
.sidebox{background:rgba(30,31,29,.70);backdrop-filter:blur(6px)}
.sidebox h3 em{font-style:normal;color:var(--accent)}
.ch .t b{color:var(--accent);font-weight:500}
.ch .box{grid-column:1;grid-row:2;width:16px;height:16px;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:11px;line-height:1;color:var(--accent-ink)}
.ch .box.on{background:var(--accent);border-color:var(--accent)}
.ch .bar2 i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(169,181,122,.7),rgba(205,215,160,.9))}
.promo .chip{align-self:flex-start;margin-bottom:8px}
.dock>*{pointer-events:auto}
.dock .chat b{color:var(--accent);font-weight:600;font-family:var(--font-mono)}
.dock .chat span{flex:1;overflow:hidden;text-overflow:ellipsis;animation:tickin .5s ease-out}
.dock .chat em{font-style:normal;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--ink-2)}
@keyframes tickin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dock .chat span{animation:none}}
@media (max-width:1300px){.home-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:none}#score,#hero,#side{grid-column:1 / -1;grid-row:auto}#hero{flex-direction:column}}
@media (max-width:900px){.home-grid{grid-template-columns:minmax(0,1fr)}.top h1{font-size:38px}.wrap{padding-left:0}.rail{position:sticky;top:0;bottom:auto;width:auto;flex-direction:row;flex-wrap:wrap;border-radius:0;padding:6px}.rail-lv{display:none}.rail .room{width:auto;flex-direction:row;padding:6px 12px}.dock{padding-left:20px}.dock .chat{min-width:0}}

/* compact layer: smaller type and gaps, controls on hover, slim Home */

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var TIERS = {
  A:{name:'Full AI', base:8,   rev:4, hint:'Under 1 min. About 1 day (8 h) plus about half a day per revision.'},
  B:{name:'Mix',     base:4.5, rev:0, hint:'Footage plus AI. 4 to 5 h.'},
  C:{name:'Normal',  base:4.5, rev:0, hint:'Ready footage. 4 to 5 h, depends on the footage.'}
};
var STATUSES = [
  {id:'idea',  label:'Idea'},
  {id:'theme', label:'Theme locked'},
  {id:'ready', label:'Brief-ready'},
  {id:'prod',  label:'In production'},
  {id:'done',  label:'Delivered'}
];
var NEEDS_GATE = {ready:1, prod:1, done:1};
var GATE = [
  ['goal','Goal'],['audience','Audience'],['product','Product'],['message','One key message'],
  ['cta','CTA'],['platform','Platform'],['postdate','Post date'],['refs','2 reference videos'],['approver','Final approver named']
];
var APPR = [['concept','Concept'],['storyboard','Storyboard'],['rough','Rough cut']];

/* ---------- state ---------- */
var db = null, canWrite = true;
var PEOPLE = ['Jayson','Alex'];
var events = [];
var videos = [];
var projects = [];   // long-standing projects: no start or end date, ongoing (Projects room)
var shoots = [];     // logged photo/video shoots: client backyard, showroom or event (Shoots room)
var intelRecs = [];  // monthly WhatsApp briefings (Intel page), one record per month
var settings = {editors:2, hours:40, buffer:25};
var view = {week:mondayOf(todayISO()), filter:'all', month:todayISO().slice(0,7), person:'all'};
var modalState = null;

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function todayISO(){return iso(new Date());}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function mondayOf(s){var d=parse(s);var diff=(d.getDay()+6)%7;d.setDate(d.getDate()-diff);return iso(d);}
function addMonths(ym,n){var p=ym.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000);}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function short(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()];}
function fmtH(h){return (Math.round(h*10)/10)+' h';}
function num(v,def,min,max){var n=parseFloat(v);if(isNaN(n))n=def;return Math.min(max,Math.max(min,n));}
function hoursFor(v){var t=TIERS[v.tier]||TIERS.C;return t.base+t.rev*(v.revisions||0);}
function refDate(v){return v.editDeadline||v.postDate||'';}
function gateDone(v){var g=v.gate||{},n=0;GATE.forEach(function(k){if(g[k[0]])n++;});return n;}
function gateMissing(g){return GATE.filter(function(k){return !g[k[0]];}).map(function(k){return k[1];});}
function statusLabel(id){var s=STATUSES.filter(function(x){return x.id===id;})[0];return s?s.label:id;}
function weekEnd(){return addDays(view.week,6);}
function inWeek(v){var d=refDate(v);return d && d>=view.week && d<=weekEnd();}
function isOverdue(v){var d=refDate(v);return v.status!=='done' && !!d && d<todayISO();}   // same rule as the risk label, the Home late count and the reports
function mem(){return canWrite && db;}

/* keep typing position when a live update re-renders */
function keepFocus(fn){
  var a=document.activeElement, id=a&&a.id, s=null, e=null;
  if(id && a.selectionStart!=null){try{s=a.selectionStart;e=a.selectionEnd;}catch(x){}}
  fn();
  if(id){var el=document.getElementById(id);if(el&&el!==document.activeElement){el.focus();try{if(s!=null)el.setSelectionRange(s,e);}catch(x){}}}
}

/* ---------- render: capacity ---------- */
function renderCapacity(){
  var items=videos.filter(inWeek);
  var raw=settings.editors*settings.hours;
  var book=raw*(1-settings.buffer/100);
  var done=0, open=0, byTier={A:{n:0,h:0},B:{n:0,h:0},C:{n:0,h:0}}, wild=0;
  items.forEach(function(v){
    var h=hoursFor(v);
    if(v.status==='done')done+=h;else open+=h;
    var t=byTier[v.tier]||byTier.C; t.n++; t.h+=h;
    if(v.wildcard)wild++;
  });
  var planned=done+open, scale=Math.max(raw,planned)*1.03||1;
  var over=planned>book;
  var pct=function(h){return (h/scale*100).toFixed(2)+'%';};
  var diff=Math.abs(book-planned);
  var flags=[];
  PEOPLE.forEach(function(p){
    var np=items.filter(function(v){return v.kind==='project' && v.assignee===p;}).length;
    if(np<2)flags.push('<div class="flag bad">'+esc(p)+' has only '+np+' of 2 mandatory client project videos this week. Add a finished villa project.</div>');
  });
  PEOPLE.forEach(function(p){
    var n=items.filter(function(v){return v.tier==='A' && v.assignee===p;}).length;
    var satOK=slotShown(p,addDays(view.week,5),'A')==='done';
    if(!n && !satOK)flags.push('<div class="flag bad">'+esc(p)+' has no Tier A video this week. Saturday is the mandatory submission.</div>');
    if(n>1)flags.push('<div class="flag bad">'+esc(p)+' has '+n+' Tier A videos this week. The rule is 1 per person.</div>');
  });
  if(wild>1)flags.push('<div class="flag bad">'+wild+' off-calendar requests this week. Only 1 wildcard slot exists, so swap one out.</div>');
  var unsched=videos.filter(function(v){return !refDate(v) && v.status!=='done' && v.status!=='idea';}).length;
  if(unsched)flags.push('<div class="flag">'+unsched+' video'+(unsched>1?'s are':' is')+' past the idea stage with no edit deadline or post date. Not in the calendar means not in the plan.</div>');
  if(!flags.length && items.length)flags.push('<div class="flag good">No rule breaks this week.</div>');

  $('#capacity').innerHTML=
    '<div class="panel-head"><h2 id="capTitle">Weekly capacity</h2><span class="hint">Counted by edit deadline, else post date</span></div>'+
    '<div class="cap-settings">'+
      '<label>Editors<input id="s-editors" type="number" min="1" max="20" step="1" value="'+settings.editors+'"'+(mem()?'':' disabled')+'></label>'+
      '<label>Hours per editor<input id="s-hours" type="number" min="1" max="80" step="1" value="'+settings.hours+'"'+(mem()?'':' disabled')+'></label>'+
      '<label>Buffer %<input id="s-buffer" type="number" min="0" max="60" step="5" value="'+settings.buffer+'"'+(mem()?'':' disabled')+'></label>'+
    '</div>'+
    '<div><div class="verdict '+(over?'bad':'good')+'">'+(items.length?(over?'Over by '+fmtH(diff):fmtH(diff)+' still bookable'):'Nothing planned this week')+'</div>'+
    '<div class="hint">'+fmtH(planned)+' planned of '+fmtH(book)+' bookable ('+fmtH(raw)+' total, '+settings.buffer+'% kept as buffer for urgent requests)</div></div>'+
    '<div class="bar'+(over?' over':'')+'" role="img" aria-label="'+fmtH(planned)+' planned of '+fmtH(book)+' bookable">'+
      '<div class="seg open" style="width:'+pct(planned)+'"></div>'+
      '<div class="seg done" style="width:'+pct(done)+'"></div>'+
      '<div class="buffer" style="left:'+pct(book)+';width:'+pct(raw-book)+'"></div>'+
    '</div>'+
    '<div class="bar-legend"><span><i class="dot" style="background:var(--accent)"></i>Delivered '+fmtH(done)+'</span>'+
    '<span><i class="dot" style="background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))"></i>Still to do '+fmtH(open)+'</span>'+
    '<span><i class="dot" style="background:repeating-linear-gradient(135deg,transparent 0 2px,var(--ink-2) 2px 3px);border:1px solid var(--ink-2)"></i>Buffer</span></div>'+
    '<div class="tiers">'+['A','B','C'].map(function(k){
      return '<div class="tier"><span class="chip '+k+'" style="align-self:flex-start">Tier '+k+'</span><b>'+TIERS[k].name+'</b>'+
        '<span class="mono">'+byTier[k].n+' video'+(byTier[k].n===1?'':'s')+' &middot; '+fmtH(byTier[k].h)+'</span><small>'+esc(TIERS[k].hint)+'</small></div>';
    }).join('')+'</div>'+
    '<div class="flags">'+flags.join('')+'</div>';
}

/* ---------- render: weekly delivery report ---------- */
function renderReport(){
  var items=videos.filter(inWeek);
  var planned=items.filter(function(v){return !v.wildcard;}).length;
  var delivered=items.filter(function(v){return v.status==='done';});
  var offCal=items.filter(function(v){return v.wildcard;});
  var tat=delivered.filter(function(v){return v.readyAt&&v.deliveredAt;}).map(function(v){return daysBetween(v.readyAt,v.deliveredAt);});
  var avgTat=tat.length?(tat.reduce(function(a,b){return a+b;},0)/tat.length):null;
  var revs=delivered.map(function(v){return v.revisions||0;});
  var avgRev=revs.length?(revs.reduce(function(a,b){return a+b;},0)/revs.length):null;
  var overdue=items.filter(isOverdue).length;
  $('#report').innerHTML=
    '<div class="panel-head"><h2 id="repTitle">Weekly delivery report</h2><span class="hint">Planned vs delivered</span></div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="n mono">'+delivered.length+' / '+items.length+'</div><div class="l">Delivered of everything due</div></div>'+
      '<div class="stat"><div class="n mono">'+planned+'</div><div class="l">On the calendar</div></div>'+
      '<div class="stat"><div class="n mono">'+PEOPLE.map(function(p){return items.filter(function(v){return v.kind==='project' && v.status==='done' && v.assignee===p;}).length+' / 2';}).join(' &middot; ')+'</div><div class="l">Client projects delivered, '+PEOPLE.join(' and ')+' (mandatory 2 a week each)</div></div>'+
      '<div class="stat"><div class="n mono">'+offCal.length+'</div><div class="l">Off-calendar requests</div></div>'+
      '<div class="stat"><div class="n mono">'+overdue+'</div><div class="l">Overdue</div></div>'+
      '<div class="stat"><div class="n mono">'+(avgTat==null?'-':(Math.round(avgTat*10)/10)+' d')+'</div><div class="l">Avg turnaround, brief-ready to delivered</div></div>'+
      '<div class="stat"><div class="n mono">'+(avgRev==null?'-':(Math.round(avgRev*10)/10))+'</div><div class="l">Avg revision rounds (2 included)</div></div>'+
    '</div>'+
    (items.length?'':'<div class="hint">No videos have an edit deadline or post date in this week yet.</div>')+
    '<div class="hint">Share this block in the weekly recap so "slow" is measured against the calendar, not against requests that came in later.</div>';
}

/* ---------- render: board ---------- */
function whoTag(p){return '<span class="who">'+esc(p||'Unassigned')+'</span>';}
function progOf(v){return v.status==='done'?'done':v.status==='prod'?'ongoing':'pending';}
function progHTML(v){
  if(!v.id||!mem())return '';
  var cur=progOf(v);
  return '<div class="prog" role="group" aria-label="Progress" style="display:flex;gap:4px">'+[['pending','Pending'],['ongoing','Ongoing'],['done','Done']].map(function(p){
    return '<button class="btn sm'+(cur===p[0]?' primary':'')+'" data-act="prog" data-p="'+p[0]+'" data-id="'+esc(v.id)+'" aria-pressed="'+(cur===p[0])+'" style="flex:1">'+p[1]+'</button>';
  }).join('')+'</div>';
}
function tierChip(v){var k=TIERS[v.tier]?v.tier:'C';return '<span class="chip '+k+'">'+k+' &middot; '+TIERS[k].name+'</span>';}
function tierHTML(v){
  if(!v.id||!mem())return '';
  var cur=TIERS[v.tier]?v.tier:'C';
  return '<div class="prog" role="group" aria-label="Video type" style="display:flex;gap:4px">'+['A','B','C'].map(function(k){
    return '<button class="btn sm'+(cur===k?' primary':'')+'" data-act="tier" data-t="'+k+'" data-id="'+esc(v.id)+'" aria-pressed="'+(cur===k)+'" style="flex:1" title="Tier '+k+': '+TIERS[k].name+'">'+k+' &middot; '+TIERS[k].name+'</button>';
  }).join('')+'</div>';
}
function assignHTML(v){
  if(!v.id||!mem())return '';
  var cur=v.assignee||'';
  return '<div class="prog" role="group" aria-label="Assigned to" style="display:flex;gap:4px">'+PEOPLE.concat(['']).map(function(p){
    return '<button class="btn sm'+(cur===p?' primary':'')+'" data-act="assign" data-who="'+esc(p)+'" data-id="'+esc(v.id)+'" aria-pressed="'+(cur===p)+'" style="flex:1" title="Assign to '+(p||'nobody')+'">'+(p||'Unassigned')+'</button>';
  }).join('')+'</div>';
}
function controlsHTML(v){var c=assignHTML(v)+tierHTML(v)+progHTML(v);return c?'<div class="ctl">'+c+'</div>':'';}
function cardHTML(v){
  var g=gateDone(v), a=v.appr||{};
  var chips=tierChip(v);
  if(v.kind==='project')chips+='<span class="chip good">Client project</span>';
  if(v.wildcard)chips+='<span class="chip warn">Wildcard</span>';
  if(isOverdue(v))chips+='<span class="chip bad">Overdue</span>';
  if((v.revisions||0)>2)chips+='<span class="chip bad">Over 2 rounds</span>';
  var next=STATUSES[STATUSES.map(function(s){return s.id;}).indexOf(v.status)+1];
  return '<div class="card" data-id="'+esc(v.id)+'">'+
    '<div>'+whoTag(v.assignee)+'</div>'+
    '<button class="t" style="all:unset;cursor:pointer;font-weight:600;line-height:1.3;overflow-wrap:anywhere" data-act="open" data-id="'+esc(v.id)+'" data-vid="'+esc(v.id)+'">'+esc(v.title||'Untitled')+'</button>'+
    '<div class="chips">'+chips+'</div>'+
    '<div class="meta">'+
      (v.postDate?'<span class="mono">Post '+short(v.postDate)+'</span>':'')+
      (v.editDeadline?'<span class="mono">Edit by '+short(v.editDeadline)+'</span>':'')+
      (v.owner?'<span>SMM: '+esc(v.owner)+'</span>':'')+
      (v.editor?'<span>Editor: '+esc(v.editor)+'</span>':'')+
    '</div>'+
    (v.manual?'':'<div class="card-foot"><span class="hint mono" title="Kickoff gate">Gate '+g+'/9</span><div class="gate-bar"><i style="width:'+(g/9*100)+'%"></i></div>'+
      '<span class="pips" title="Written approvals: concept, storyboard, rough cut">'+APPR.map(function(k){return '<i class="pip'+(a[k[0]]?' on':'')+'"></i>';}).join('')+'</span>'+
      '<span class="hint mono">R'+(v.revisions||0)+'/2</span></div>')+
    controlsHTML(v)+
    (next&&mem()?'<button class="btn sm" data-act="advance" data-id="'+esc(v.id)+'">Move to '+esc(next.label)+'</button>':'')+
  '</div>';
}
/* long lists: show the first few, fold the rest. Open/closed state survives the 20 s refresh. */
var foldOpen={};
function foldList(items,limit,key){
  if(items.length<=limit)return items.join('');
  return items.slice(0,limit).join('')+
    '<details data-fold="'+esc(key)+'"'+(foldOpen[key]?' open':'')+'><summary class="hint" style="cursor:pointer;font-weight:600;padding:6px 0">Show '+(items.length-limit)+' more</summary>'+
    '<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">'+items.slice(limit).join('')+'</div></details>';
}
document.addEventListener('toggle',function(e){var d=e.target; if(d&&d.getAttribute&&d.getAttribute('data-fold'))foldOpen[d.getAttribute('data-fold')]=d.open;},true);
function renderBoard(){
  var list=videos.filter(personOK);
  if(view.filter==='week')list=list.filter(inWeek);
  var html=
    '<div class="panel-head">'+personTabs()+
    '<div class="toolbar"><select id="filter" aria-label="Filter"><option value="all"'+(view.filter==='all'?' selected':'')+'>All videos</option><option value="week"'+(view.filter==='week'?' selected':'')+'>This week only</option></select>'+
    (mem()?'<button class="btn primary" data-act="new">Add video</button>':'')+'</div></div>'+
    '<div class="flow" aria-label="Video procedure"><span class="s">Brief</span><span class="a">&rarr;</span><span class="s">Concept check</span><span class="a">&rarr;</span><span class="s">Storyboard</span><span class="a">&rarr;</span><span class="s">Rough cut</span><span class="a">&rarr;</span><span class="s">Final</span><span class="a">&rarr;</span><span class="s">Post</span></div>';
  if(!videos.length){
    html+='<div class="empty-state"><h3>No videos on the calendar yet</h3>'+
      '<div class="muted" style="max-width:62ch">Start with the monthly brain dump: one row per video with a post date, an edit deadline, a tier and an owner. Themes can be added first and the nine kickoff items filled in when the brief is ready.</div>'+
      (mem()?'<button class="btn primary" data-act="new">Add the first video</button>':'<div class="hint">Ask the calendar owner to add videos.</div>')+'</div>';
  }
  html+='<div class="board">'+STATUSES.map(function(s){
    var col=list.filter(function(v){return (v.status||'idea')===s.id;}).sort(function(a,b){return (refDate(a)||'9999').localeCompare(refDate(b)||'9999');});
    return '<div class="col"><div class="col-head"><span>'+s.label+'</span><span class="cnt">'+col.length+'</span></div>'+
      (col.length?foldList(col.map(cardHTML),4,'col-'+s.id):'<div class="empty-col">Nothing here</div>')+'</div>';
  }).join('')+'</div>';
  $('#boardPanel').innerHTML=html;
}

/* ---------- render: watch (both editors see every project) ---------- */
function slotInfo(p,d,i){
  var t=WEEK_SLOT[i], st=slotState(p,d,t), auto=st==='done'?'done':'open', key=mondayOf(d)+'|'+p+'|'+i, man=(settings.weekOv||{})[key];
  return {t:t, st:st, auto:auto, key:key, man:man, ok:(man||auto)==='done'};
}
function renderGodView(){
  var today=todayISO(), wk=view.week;
  var days=[]; for(var i=0;i<7;i++) days.push(addDays(wk,i));
  var DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var head='<div class="gv-cell gv-h"></div>'+days.map(function(d,i){
    return '<div class="gv-cell gv-h'+(d===today?' gv-today':'')+'">'+DN[i]+' <span class="mono">'+short(d)+'</span></div>';
  }).join('');
  var body=PEOPLE.map(function(p){
    var missing=0, doneSlots=0;
    var cells=days.map(function(d,i){

function crc32(u8){

  if(!t){t=crc32.t=[]; for(n=0;n<256;n++){c=n; for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0;}}

  return (crc^0xFFFFFFFF)>>>0;

function zipStore(files,mime){

    var nameB=enc.encode(f.name), data=enc.encode(f.data), crc=crc32(data);
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint16(10,dt,true); lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nameB,data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,dt,true); ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nameB.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameB);

  return new Blob(chunks.concat(central,[new Uint8Array(end.buffer)]),{type:mime||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xesc(s){return String(s==null?'':s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function slotState(p,d,tier){

function calStatus(pool){

/* ---------- shift timer (work hours 7:30 AM to 4:00 PM, Monday to Saturday) ---------- */
var SHIFT_START=[7,30], SHIFT_END=[16,0];
function shiftInfo(now){
  now=now||new Date();
  var s=new Date(now), e=new Date(now);
  s.setHours(SHIFT_START[0],SHIFT_START[1],0,0); e.setHours(SHIFT_END[0],SHIFT_END[1],0,0);
  if(now.getDay()===0)return {state:'off',ms:0,pct:0};
  if(now<s)return {state:'before',ms:s-now,pct:0};
  if(now<e)return {state:'on',ms:e-now,pct:Math.round((now-s)/(e-s)*100)};
  return {state:'after',ms:0,pct:100};
}
function hm(ms){var m=Math.max(0,Math.ceil(ms/60000));return Math.floor(m/60)+'h '+('0'+(m%60)).slice(-2)+'m';}
function renderShift(){
  var el=document.getElementById('shift'); if(!el)return;
  var sh=shiftInfo(), html;
  if(sh.state==='on') html='<b>Shift ends</b> <span class="mono">'+hm(sh.ms)+'</span><small>4:00 PM</small>';
  else if(sh.state==='before') html='<b>Shift starts</b> <span class="mono">'+hm(sh.ms)+'</span><small>7:30 AM</small>';
  else if(sh.state==='after') html='<b>Shift over</b> <span class="mono">&#10003;</span><small>see you 7:30 AM</small>';
  else html='<b>Rest day</b><small>Sunday</small>';
  el.innerHTML=html+'<i style="width:'+sh.pct+'%"></i>';
  el.className='shift'+(sh.state==='on'&&sh.ms<=3600000?' urgent':'')+(sh.state==='on'?' on':'');
  el.title='Work hours 7:30 AM to 4:00 PM, Monday to Saturday';
}
renderShift(); setInterval(renderShift,15000);

/* ---------- God's eye view: short messages pop up in today's cell ---------- */
var gvPopIdx=0;
function gvPopMsgs(p){
  var today=todayISO(), di=(new Date().getDay()+6)%7, sh=shiftInfo(), m=[];
  if(di>5){m.push('Rest day. Plan the week.');return m;}
  var inf=slotInfo(p,today,di);
  if(inf.ok){
    m.push('Slot done &#10003; Nice work!');
    if(sh.state==='on')m.push(hm(sh.ms)+' left before the shift ends.');
  } else if(sh.state==='after'){
    m.push('Shift over. Tier '+inf.t+' slot still open!');
  } else {
    m.push('Make at least 1 video today!');
    m.push('Tier '+inf.t+' ('+TIERS[inf.t].name+') due today.');
    if(sh.state==='on')m.push('You got '+hm(sh.ms)+' more before 4:00 PM.');
    if(sh.state==='before')m.push('Shift starts 7:30 AM. Plan your Tier '+inf.t+'.');
  }
  return m;
}
function gvPop(){
  var cells=document.querySelectorAll('#godview .gv-cell[data-gvp]');
  if(!cells.length)return;
  [].forEach.call(cells,function(c){
    var msgs=gvPopMsgs(c.getAttribute('data-gvp')); if(!msgs.length)return;
    var old=c.querySelector('.gv-pop'); if(old)old.remove();
    var b=document.createElement('div'); b.className='gv-pop'; b.innerHTML=msgs[gvPopIdx%msgs.length];
    c.appendChild(b);
    setTimeout(function(){if(b.parentNode)b.classList.add('out');},5200);
    setTimeout(function(){if(b.parentNode)b.remove();},5700);
  });
  gvPopIdx++;
}
setTimeout(gvPop,2500); setInterval(gvPop,12000);

/* ---------- orchestrated flip: boxes in the open room flip in a wave ---------- */
var FLIP_SEL='.kv,.sidebox,.hero-stats span,.gv-cell:not(.gv-h):not(.gv-name),.cal-cell,.card,.inv-row,.stat,.skill-card,.op-row';
function flipWave(){
  var list=[].filter.call(document.querySelectorAll(FLIP_SEL),function(el){return el.offsetParent!==null;}).slice(0,70);
  list.forEach(function(el,i){
    el.classList.remove('flip'); void el.offsetWidth;
    el.style.animationDelay=(i*28)+'ms';
    el.classList.add('flip');
    setTimeout(function(){el.classList.remove('flip');el.style.animationDelay='';},700+i*28);
  });
}

  if(!window.deskSkills)return;
  window.deskSkills().then(function(d){skillState.custom=d.skills||[];renderSkills();})
    .catch(function(e){skillState.err='Could not load custom skills: '+((e&&e.message)||e);renderSkills();});
}
function loadSkill(){
  if(!window.deskSkill){setTimeout(loadSkill,250);return;}   // data layer script loads after this one
  if(!skillState.text && !skillState.loading){
    skillState.loading=true; skillState.err='';
    window.deskSkill().then(function(d){skillState.text=d.text||''; skillState.updated=d.updated||''; skillState.files=d.files||[];})
      .catch(function(e){skillState.err='Could not load the skill: '+((e&&e.message)||e);})
      .then(function(){skillState.loading=false; renderSkills(); skillLoadCustom();});
  } else {
    skillLoadCustom();
  }
}
function skillSaveBlob(blob,name){
  var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},4000);
}
function skillZipFile(){
  return zipStore(skillState.files.map(function(f){return {name:f.path,data:f.text};}),'application/zip');
}
function skillSave(){
  skillReadDraft();
  var d=skillState.draft, name=String(d.name||'').trim().toLowerCase();
  if(!/^[a-z0-9-]{2,60}$/.test(name)){skillState.addErr='Name: lowercase letters, numbers and dashes, 2 to 60 characters.';renderSkills();return;}
  if(name==='ducon-dashboard'){skillState.addErr='ducon-dashboard is the built-in skill. Pick another name.';renderSkills();return;}
  if(!d.text.trim()){skillState.addErr='Paste the skill text or choose a .md file first.';renderSkills();return;}
  if(skillFind(name) && skillState.replaceFor!==name){
    skillState.replaceFor=name; skillState.addErr='A skill named '+name+' already exists. Press Save again to replace it.'; renderSkills(); return;
  }
  skillState.saving=true; skillState.addErr='';
  window.deskSkillSave(name,{text:d.text,description:d.desc.trim()}).then(function(){
    skillState.adding=false; skillState.replaceFor=''; skillState.saving=false; skillState.draft={name:'',desc:'',text:''};
    return window.deskSkills();
  }).then(function(r){skillState.custom=r.skills||[];renderSkills();})
    .catch(function(e){skillState.saving=false; skillState.addErr=(e&&e.message)||'Save failed.'; renderSkills();});
}
function skillRemove(name){
  skillState.pendingDel='';
  window.deskSkillDelete(name).then(function(){return window.deskSkills();})
    .then(function(r){skillState.custom=r.skills||[];renderSkills();})
    .catch(function(e){skillState.err=(e&&e.message)||'Delete failed.';renderSkills();});
}
function skillAct(act,el){
  if(act==='skilladd'){skillState.adding=true;skillState.addErr='';renderSkills();}
  else if(act==='skillcancel'){skillState.adding=false;skillState.replaceFor='';skillState.addErr='';renderSkills();}
  else if(act==='skillsave'){skillSave();}
  else if(act==='skillzip'){
    if(!skillState.files.length){skillState.err='The zip is not ready yet. Reload the page.';renderSkills();return;}
    skillSaveBlob(skillZipFile(),'ducon-dashboard.zip');
  }
  else if(act==='skillzipall'){
    if(!skillState.custom.length)return;
    var all=skillState.custom.map(function(s){return {name:s.name+'/SKILL.md',data:s.text};});
    skillSaveBlob(zipStore(all,'application/zip'),'custom-skills-'+todayISO()+'.zip');
  }
  else if(act==='skilldl'){ if(skillState.text) skillSaveBlob(new Blob([skillState.text],{type:'text/markdown'}),'SKILL.md'); }
  else if(act==='skillcp'){
    if(!skillState.text)return;
    var done=function(){skillState.copied=true; renderSkills(); setTimeout(function(){skillState.copied=false; renderSkills();},2000);};
    try{navigator.clipboard.writeText(skillState.text).then(done,function(){});}catch(x){}
  }
  else if(act==='skillcdl'){ var s=skillFind(el.getAttribute('data-name')); if(s) skillSaveBlob(new Blob([s.text],{type:'text/markdown'}),s.name+'.md'); }
  else if(act==='skillask'){ skillState.pendingDel=el.getAttribute('data-name'); renderSkills(); }
  else if(act==='skillrm'){ skillRemove(el.getAttribute('data-name')); }
}
document.addEventListener('change', function(e){
  if(e.target.id!=='f-skfile')return;
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  if(f.size>200000){skillState.addErr='That file is larger than 200 KB.';renderSkills();return;}
  var rd=new FileReader();
  rd.onload=function(){
    skillReadDraft();
    skillState.draft.text=String(rd.result||'');
    if(!skillState.draft.name) skillState.draft.name=f.name.replace(/\.md$/i,'').toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
    skillState.addErr=''; renderSkills();
  };
  rd.readAsText(f,'utf-8');
});
var ROOM_IDS=['home','cal','inv','board','proj','shoot','focus','brief','rep','skills'];
function showRoom(r){
  if(ROOM_IDS.indexOf(r)<0)r='home';
  try{localStorage.setItem('deskRoom',r);}catch(e){}
  try{history.replaceState(null,'','#'+r);}catch(e){}
  [].forEach.call(document.querySelectorAll('[data-room]'),function(el){
    if(el.tagName==='BUTTON')return;
    el.hidden=el.getAttribute('data-room')!==r;
  });
  if(r==='skills'){renderSkills(); loadSkill();}
  if(r==='home'){renderIntel(); tickDesc();}
  if(typeof flipWave==='function')setTimeout(flipWave,60);
  [].forEach.call(document.querySelectorAll('#rooms .room'),function(b){
    if(b.getAttribute('data-room')===r)b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
}
(function(){
  var r=(location.hash||'').slice(1);
  if(ROOM_IDS.indexOf(r)<0){try{r=localStorage.getItem('deskRoom')||'';}catch(e){r='';}}
  showRoom(r);
})();

/* ---- Data layer: Cloudflare Pages Functions + D1 via /api (replaces claude.ai db) ---- */
(function(){
  var state = {videos:[], events:[], settings:null};
  var subs = [];

  function run(fn, args){
    args = args || [];
    var req;
    if (fn === 'getAll') req = ['GET', '/api/all'];
    else if (fn === 'saveRecord') req = ['PUT', '/api/record/' + encodeURIComponent(args[0]) + '/' + encodeURIComponent(args[1]), args[2]];
    else if (fn === 'deleteRecord') req = ['DELETE', '/api/record/' + encodeURIComponent(args[0]) + '/' + encodeURIComponent(args[1])];
    else if (fn === 'getSkill') req = ['GET', '/api/skill'];
    else if (fn === 'saveSettings') req = ['PUT', '/api/record/settings/team', args[0]];
    else if (fn === 'getSkills') req = ['GET', '/api/skills'];
    else if (fn === 'saveSkill') req = ['PUT', '/api/record/skills/' + encodeURIComponent(args[0]), args[1]];
    else if (fn === 'deleteSkill') req = ['DELETE', '/api/record/skills/' + encodeURIComponent(args[0])];
    else return Promise.reject(new Error('Unknown call ' + fn));
    var headers = {};
    if (req[2]) headers['content-type'] = 'application/json';
    if (accessCode()) headers.authorization = 'Bearer ' + accessCode();
    return fetch(req[1], {
      method: req[0],
      headers: headers,
      body: req[2] ? JSON.stringify(req[2]) : undefined,
      credentials: 'same-origin'
    }).then(function(r){
      if (r.status === 401) showLogin(accessCode() ? 'That code was not accepted. Try again.' : '');
      if (!r.ok) return r.json().then(function(j){ throw new Error((j && j.error) || ('Request failed: ' + r.status)); }, function(){ throw new Error('Request failed: ' + r.status); });
      return r.json();
    });
  }

  function accessCode(){
    try { return localStorage.getItem('deskCode') || ''; } catch (e) { return ''; }
  }
  var loginShown = false;
  function showLogin(msg){
    if (loginShown) return;
    loginShown = true;
    var o = document.createElement('div');
    o.setAttribute('role', 'dialog');
    o.setAttribute('aria-modal', 'true');
    o.setAttribute('aria-labelledby', 'desk-login-title');
    o.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(5,12,14,.9);display:flex;align-items:center;justify-content:center;padding:16px';
    o.innerHTML = '<form id="desk-login" style="background:var(--surface);border:1px solid var(--accent);border-radius:2px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px">' +
      '<h2 id="desk-login-title">Ducon Editor&#39;s War Room</h2>' +
      '<label for="desk-code" class="hint">Enter your access code</label>' +
      '<input id="desk-code" type="password" autocomplete="current-password" style="background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:9px;color:var(--ink);font:inherit">' +
      '<div class="err" role="alert"></div>' +
      '<button class="btn primary" type="submit">Sign in</button></form>';
    o.querySelector('.err').textContent = msg || '';
    document.body.appendChild(o);
    o.querySelector('#desk-login').addEventListener('submit', function(e){
      e.preventDefault();
      var v = o.querySelector('#desk-code').value.trim();
      if (!v) return;
      try { localStorage.setItem('deskCode', v); } catch (x) {}
      location.reload();
    });
    o.querySelector('#desk-code').focus();
  }
  function notify(){ subs.forEach(function(f){ try { f(); } catch (e) {} }); }
  function refresh(){
    return run('getAll').then(function(d){ state = d; notify(); document.dispatchEvent(new CustomEvent('desk-sync',{detail:{ok:true}})); }).catch(function(e){ console.error(e); document.dispatchEvent(new CustomEvent('desk-sync',{detail:{ok:false}})); });
  }
  function subscribe(fn){
    subs.push(fn); fn();
    return function(){ subs.splice(subs.indexOf(fn), 1); };
  }
  function newId(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function rowsOf(table){
    return (state[table] || []).map(function(o){ return {id: o.id, exists: true, data: function(){ return o; }}; });
  }

  function Col(name){ this.name = name; }
  Col.prototype.onSnapshot = function(next){
    var name = this.name;
    return subscribe(function(){ next({docs: rowsOf(name), size: 0, empty: false}); });
  };
  Col.prototype.doc = function(id){ return new Ref(this.name, id || newId()); };
  Col.prototype.add = function(data){
    var r = this.doc();
    return r.set(data).then(function(){ return r; });
  };

  function Ref(table, id){ this.table = table; this.id = id; }
  Ref.prototype.set = function(data){
    return run('saveRecord', [this.table, this.id, Object.assign({}, data)]).then(refresh);
  };
  Ref.prototype.update = function(data){
    var self = this;
    var cur = (state[this.table] || []).filter(function(o){ return o.id === self.id; })[0] || {};
    var merged = Object.assign({}, cur, data);
    delete merged.id;
    return this.set(merged);
  };
  Ref.prototype.delete = function(){
    return run('deleteRecord', [this.table, this.id]).then(refresh);
  };

  function SettingsRef(){}
  SettingsRef.prototype.set = function(data){ return run('saveSettings', [data]).then(refresh); };
  // Read the newest settings first, apply the change on top, then save. Stops one person's edit wiping the other's.
  SettingsRef.prototype.merge = function(fn){
    return run('getAll').then(function(d){
      state = d;
      return run('saveSettings', [fn(d.settings || {})]);
    }).then(refresh);
  };
  SettingsRef.prototype.onSnapshot = function(next){
    return subscribe(function(){
      next({exists: !!state.settings, data: function(){ return state.settings; }});
    });
  };

  window.deskSkill = function(){ return run('getSkill'); };
  window.deskSkills = function(){ return run('getSkills'); };
  window.deskSkillSave = function(n,o){ return run('saveSkill',[n,o]); };
  window.deskSkillDelete = function(n){ return run('deleteSkill',[n]); };

  var DB = {
    collection: function(name){ return new Col(name); },
    doc: function(path){
      var p = path.split('/');
      if (p[0] === 'settings') return new SettingsRef();
      throw new TypeError('Unsupported path ' + path);
    }
  };

  var userApi = {can: function(){ return Promise.resolve(true); }};

  window.claude = {
    use: function(name){
      if (name === 'db') return Promise.resolve(DB);
      if (name === 'user') return Promise.resolve(userApi);
      return Promise.resolve(null);
    }
  };

  if (accessCode()) {
    var signOut = document.createElement('button');
    signOut.className = 'btn sm';
    signOut.textContent = 'Sign out';
    signOut.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:20';
    signOut.addEventListener('click', function(){
      try { localStorage.removeItem('deskCode'); } catch (x) {}
      location.reload();
    });
    document.body.appendChild(signOut);
  }

  refresh();
  setInterval(refresh, 20000);
})();

(async function(){
  var c=window.claude;
  if(!c||!c.use){banner('Shared board is not available in this view. Open the page from claude.ai to load and edit the team calendar.');return;}
  try{ db=await c.use('db'); }catch(x){ db=null; }
  if(!db){banner('Sign in to claude.ai to see the shared team calendar. Nothing is stored in this view.');renderAll();return;}
  try{
    var u=await c.use('user');
    if(u && typeof u.can==='function'){ var w=await u.can('data.write'); if(w===false)canWrite=false; }
  }catch(x){}
  if(!canWrite)banner('You have view-only access. Ask the owner for Contributor access to edit the board.');
  function bad(){banner('The shared board could not be loaded. Reload the page to try again.');}
  db.collection('videos').onSnapshot(function(s){videos=snapList(s);renderAll();},bad);
  db.collection('events').onSnapshot(function(s){events=snapList(s);renderAll();},bad);
  db.collection('projects').onSnapshot(function(s){projects=snapList(s);renderAll();},bad);
  db.collection('shoots').onSnapshot(function(s){shoots=snapList(s);renderAll();},bad);
  db.collection('intel').onSnapshot(function(s){intelRecs=snapList(s);renderAll();},bad);
  setInterval(function(){
    document.querySelectorAll('.eta').forEach(function(el){
      var ms=new Date(el.getAttribute('data-eta')).getTime()-Date.now();
      el.textContent=etaText(ms);
      el.className='chip '+etaCls(ms)+' eta';
    });
  },60000);
  db.doc('settings/team').onSnapshot(function(s){
    if(s.exists){var o=s.data()||{};settings={editors:num(o.editors,2,1,20),hours:num(o.hours,40,1,80),buffer:num(o.buffer,25,0,60),weekOv:(o.weekOv&&typeof o.weekOv==='object')?o.weekOv:{}};}
    renderAll();
  },bad);
})();
})();
</script>
